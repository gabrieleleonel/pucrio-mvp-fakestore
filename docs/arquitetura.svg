<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Cliente -->
  <rect x="360" y="20" width="180" height="60" rx="10" fill="#ffe8a3" stroke="#b8860b" stroke-width="2"/>
  <text x="450" y="55" text-anchor="middle" font-size="16">Navegador (usuário)</text>

  <!-- Frontend -->
  <rect x="330" y="150" width="240" height="80" rx="10" fill="#fce4d6" stroke="#c0392b" stroke-width="2"/>
  <text x="450" y="185" text-anchor="middle" font-size="16" font-weight="bold">Interface (Front-End)</text>
  <text x="450" y="207" text-anchor="middle" font-size="13">React + Vite (container Nginx)</text>

  <!-- Backend -->
  <rect x="60" y="310" width="260" height="90" rx="10" fill="#d6e4f0" stroke="#1a5276" stroke-width="2"/>
  <text x="190" y="340" text-anchor="middle" font-size="16" font-weight="bold">API (Back-End)</text>
  <text x="190" y="362" text-anchor="middle" font-size="13">FastAPI + SQLite (container)</text>
  <text x="190" y="382" text-anchor="middle" font-size="12">Rotas: POST/GET/PUT/DELETE /pedidos</text>

  <!-- FakeStore -->
  <rect x="580" y="310" width="260" height="90" rx="10" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="710" y="340" text-anchor="middle" font-size="16" font-weight="bold">FakeStore API</text>
  <text x="710" y="362" text-anchor="middle" font-size="13">Serviço externo (público)</text>
  <text x="710" y="382" text-anchor="middle" font-size="12">GET /products (catálogo)</text>

  <!-- Setas -->
  <line x1="450" y1="80" x2="450" y2="150" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="450" y1="150" x2="450" y2="80" stroke="#333" stroke-width="2" marker-end="url(#seta)" transform="translate(20,0)"/>

  <line x1="380" y1="230" x2="230" y2="310" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="230" y1="310" x2="380" y2="230" stroke="#333" stroke-width="2" marker-end="url(#seta)" transform="translate(0,-20)"/>

  <line x1="520" y1="230" x2="680" y2="310" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>

  <text x="330" y="270" font-size="12" fill="#555">REST: pedidos</text>
  <text x="590" y="270" font-size="12" fill="#555">REST: catálogo</text>
</svg>
